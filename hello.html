<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Tracking Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }

        body {

            background:
                linear-gradient(135deg,
                    #081226,
                    #132542);

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            color: white;

        }

        .box {

            width: 900px;

            padding: 40px;

            border-radius: 30px;

            background:
                rgba(255, 255, 255, .08);

            backdrop-filter: blur(12px);

        }

        h1 {

            margin-bottom: 20px;

        }

        input {

            width: 100%;

            padding: 18px;

            border: none;

            border-radius: 16px;

            margin-top: 12px;

        }

        button {

            margin-top: 15px;

            width: 100%;

            padding: 18px;

            border: none;

            border-radius: 16px;

            background: #2563eb;

            color: white;

            cursor: pointer;

        }

        .result {

            display: none;

            margin-top: 35px;

            background: #0b1426;

            padding: 25px;

            border-radius: 18px;

        }

        .badge {

            display: inline-block;

            padding: 10px 18px;

            border-radius: 999px;

            background: #16a34a;

            margin-top: 10px;

        }

        .info {

            margin-top: 25px;

            line-height: 2;

        }
    </style>

</head>

<body>

    <div class="box">

        <h1>📦 Package Tracker</h1>

        <input id="track" placeholder="Enter Tracking ID" value="ltr!8kmh5Vpjw" />

        <button onclick="track()">

            Track Package

        </button>

        <div class="result" id="result">

            <h2 id="title">

                Loading...

            </h2>

            <div class="badge" id="status">

                Checking

            </div>

            <div class="info">

                <p>
                    Tracking:
                    <span id="tid"></span>
                </p>

                <p>
                    Location:
                    <span id="loc"></span>
                </p>

                <p>
                    ETA:
                    <span id="eta"></span>
                </p>

            </div>

        </div>

    </div>

    <script>

        /*
        PASTE ONLY YOUR API KEY HERE
        */

        const API_KEY =
            "th_apk_live_6IW9aDSDZUL15QY2MFPxVKcGrC3b9l2LzYHE";


        async function track() {

            const id =
                document
                    .getElementById(
                        "track"
                    )
                    .value;

            try {

                /*
                PUT YOUR TRACKING URL
                IF DOCUMENTATION PROVIDES ONE
                */

                const response =
                    await fetch(

                        "https://YOUR_ENDPOINT?id="
                        +
                        encodeURIComponent(id),

                        {

                            headers: {

                                Authorization:
                                    "Bearer "
                                    +
                                    API_KEY

                            }

                        }

                    );

                const data =
                    await response.json();

                document
                    .getElementById(
                        "result"
                    )
                    .style.display =
                    "block";

                document
                    .getElementById(
                        "title"
                    )
                    .innerHTML =
                    data.title
                    ||
                    "Package Found";

                document
                    .getElementById(
                        "status"
                    )
                    .innerHTML =
                    data.status
                    ||
                    "Processing";

                document
                    .getElementById(
                        "tid"
                    )
                    .innerHTML =
                    id;

                document
                    .getElementById(
                        "loc"
                    )
                    .innerHTML =
                    data.location
                    ||
                    "Transit";

                document
                    .getElementById(
                        "eta"
                    )
                    .innerHTML =
                    data.eta
                    ||
                    "Unavailable";

            }

            catch {

                alert(
                    "Tracking unavailable"
                );

            }

        }

    </script>

</body>

</html>
